name = "oj-backend"
main = "src/index.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
account_id = ""

[[d1_databases]]
binding = "DB"
database_name = "oj-database"
database_id = ""

[assets]
directory = "../frontend/public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[send_email]]
name = "SEND_EMAIL"

[vars]
GITHUB_CLIENT_ID = ""
GITHUB_CLIENT_SECRET = ""
GITHUB_TOKEN = ""
CPOAUTH_CLIENT_ID = ""
CPOAUTH_CLIENT_SECRET = ""
CALLBACK_SECRET = ""
JWT_SECRET = ""
JUDGE_REPO = ""
FRONTEND_URL = ""
REGISTRATION_OPEN = "true"
DEFAULT_FROM_EMAIL = ""